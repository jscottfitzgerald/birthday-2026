<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Puzzle 9 · The Birthday Games</title>
<link rel="stylesheet" href="css/style.css?v=10" />
</head>
<body>
  <div class="hearts-bg" id="heartsBg"></div>

  <div class="container">
    <h1>🔍 Spot the Difference 🔍</h1>
    <p class="subtitle">Compare the top and bottom photos and tap all 6 differences on either image!</p>

    <div class="card">
      <div class="bs-indicator-row">
        <span class="bs-indicator" id="stdProgress">0 / 6 differences found</span>
      </div>

      <div class="std-stack">
        <div class="std-panel" id="panelA">
          <img id="imgA" src="images/puzzle9-a.png" alt="Spot the difference top image" />
        </div>

        <div class="std-panel" id="panelB">
          <img id="imgB" src="images/puzzle9-b.png" alt="Spot the difference bottom image" />
        </div>
      </div>

      <div class="feedback" id="stdFeedback"></div>

      <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px;">
        <button type="button" class="queens-btn" id="resetBtn">🔄 Reset</button>
        <button type="button" class="queens-btn" id="debugBtn" style="display: none;">👀 Toggle Hotspots (test)</button>
      </div>
    </div>

    <a href="index.html" class="back-link">← Back to The Birthday Games</a>
  </div>

  <script src="js/progress.js?v=7"></script>
  <script src="js/hearts.js?v=5"></script>
  <script src="js/puzzle9.js?v=3"></script>
</body>
</html>
