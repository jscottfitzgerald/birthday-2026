<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Puzzle 6 · The Birthday Games</title>
<link rel="stylesheet" href="css/style.css?v=7" />
</head>
<body>
  <div class="hearts-bg" id="heartsBg"></div>

  <div class="container">
    <h1>🚢 Battleships 🚢</h1>
    <p class="subtitle">Sink the computer's whole fleet before it sinks yours!</p>

    <div class="card" id="alreadySolved" style="display:none;">
      <p>🎉 You've already solved this one!</p>
      <a href="reward6.html" class="btn">Open your reward 🎁</a>
    </div>

    <div id="bsGameWrapper">
      <div class="bs-indicator-row"><span class="bs-indicator" id="bsIndicator"></span></div>

      <div id="bsPlay">
        <p class="bs-status" id="bsStatus"></p>
        <p class="bs-log" id="bsLog"></p>

        <p class="bs-label">Enemy waters &mdash; tap a square to fire</p>
        <div class="bs-board-wrapper"><div class="bs-board" id="bsEnemyBoard"></div></div>

        <p class="bs-label">Your fleet</p>
        <div class="bs-board-wrapper"><div class="bs-board mini" id="bsMyBoard"></div></div>

        <div class="bs-actions">
          <button type="button" class="btn" id="bsShuffleBtn">🔀 Shuffle my ships</button>
          <button type="button" class="btn" id="bsAgainBtn" style="display:none;">Try again</button>
        </div>
      </div>

      <div class="card" id="bsQuestionCard" style="display:none;">
        <p id="bsQuestionText"></p>

        <!-- Game 1: yes / no -->
        <div class="bs-choice-row" id="bsChoiceRow" style="display:none;">
          <button type="button" class="btn" id="bsYesBtn">Yes</button>
          <button type="button" class="btn" id="bsNoBtn">No</button>
        </div>

        <!-- Game 2: slider -->
        <div class="bs-slider-row" id="bsSliderRow" style="display:none;">
          <p class="bs-slider-value" id="bsSliderValue"></p>
          <input type="range" id="bsSlider" min="1" max="10" step="1" value="5" />
          <div class="bs-slider-ends"><span>1</span><span>10</span></div>
          <button type="button" class="btn" id="bsSliderSubmit">Submit</button>
        </div>

        <!-- Game 3: free text -->
        <form class="answer-form" id="bsAnswerForm" style="display:none;">
          <input type="text" id="bsAnswerInput" placeholder="Type your answer..." autocomplete="off" required />
          <button type="submit" class="btn">Submit</button>
        </form>
      </div>
    </div>

    <div class="card" id="bsAllComplete" style="display:none;">
      <p>🎉 You won all 3 battles!</p>
      <a href="reward6.html" class="btn">Open your reward 🎁</a>
    </div>

    <a href="index.html" class="back-link">← Back to The Birthday Games</a>
  </div>

  <script src="js/progress.js?v=4"></script>
  <script src="js/hearts.js"></script>
  <script src="js/battleships-engine.js"></script>
  <script src="js/puzzle6.js?v=7"></script>
</body>
</html>
