<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Puzzle 7 · The Birthday Games</title>
<link rel="stylesheet" href="css/style.css?v=8" />
</head>
<body>
  <div class="hearts-bg" id="heartsBg"></div>

  <div class="container">
    <h1>❓ Wordplay ❓</h1>
    <p class="subtitle">Three riddles. One answer each.</p>

    <div class="card" id="riddleCard">
      <div class="bs-indicator-row"><span class="bs-indicator" id="riddleIndicator"></span></div>
      <p class="poem-text" id="riddleText" style="margin: 14px 0 18px;"></p>

      <div style="margin-bottom: 16px;">
        <button type="button" class="queens-btn" id="hintBtn">💡 Hint</button>
        <p id="hintText" style="display: none; font-style: italic; font-size: 0.95rem; margin: 6px 0 0; opacity: 0.85;"></p>
      </div>

      <form class="answer-form" id="riddleForm">
        <input type="text" id="riddleInput" placeholder="Type your answer..." autocomplete="off" required />
        <button type="submit" class="btn">Submit</button>
        <div class="feedback" id="riddleFeedback"></div>
      </form>
    </div>

    <a href="index.html" class="back-link">← Back to The Birthday Games</a>
  </div>

  <script src="js/progress.js?v=5"></script>
  <script src="js/hearts.js"></script>
  <script src="js/puzzle7.js?v=5"></script>
</body>
</html>
