<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Puzzle 4 · The Birthday Games</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="hearts-bg" id="heartsBg"></div>

  <div class="container">
    <h1>🟪 A Melon Wordle 🟧</h1>
    <p class="subtitle">Guess the word in 6 tries to earn a reward!</p>

    <div class="card" id="alreadySolved" style="display:none;">
      <p>🎉 You've already solved this one! You can head to the next clue.</p>
      <a href="reward4.html" class="btn">Well done my love, open your reward 🎁</a>
    </div>

    <div id="wordleGame">
      <div class="wordle-board" id="wordleBoard"></div>
      <div class="wordle-message" id="wordleMessage"></div>
      <div class="wordle-keyboard" id="wordleKeyboard"></div>
    </div>

    <div class="card" id="wordleComplete" style="display:none;">
      <p>🎉 You solved it!</p>
      <div class="wordle-clue-word" id="wordleClueWord"></div>
      <p class="wordle-clue-text" id="wordleClueText"></p>
      <a href="reward4.html" class="btn">Open your reward 🎁</a>
    </div>

    <a href="index.html" class="back-link">← Back to The Birthday Games</a>
  </div>

  <script src="js/progress.js"></script>
  <script src="js/hearts.js"></script>
  <script src="js/puzzle4.js"></script>
</body>
</html>
